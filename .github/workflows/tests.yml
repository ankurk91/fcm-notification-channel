name: tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 0 11 * *'

jobs:
  tests:

    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.3, 8.4, 8.5 ]
        laravel: [ 12, 13 ]
        firebase: [ 7, 8 ]
        dependency-version: [ prefer-lowest, prefer-stable ]
        exclude:
          # kreait/laravel-firebase v7.1+ (required for Laravel 13) needs kreait/firebase-php v8
          - laravel: 13
            firebase: 7

    name: PHP ${{ matrix.php }} - Laravel v${{ matrix.laravel }} - Firebase v${{ matrix.firebase }} - ${{ matrix.dependency-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, json, mbstring, openssl, xml, zip, zlib
          ini-values: error_reporting=E_ALL
          coverage: pcov

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts=^${{ matrix.laravel }}" --dev --no-update
          composer require "kreait/firebase-php=^${{ matrix.firebase }}" --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: composer test:coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
